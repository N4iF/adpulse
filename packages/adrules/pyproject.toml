[project]
name = "adrules"
version = "0.0.1"
description = "Checks, Finding model, prioritization, path graph and control evidence for AD snapshots (ADPulse engine)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Naif Al Anazi" }]
dependencies = [
  "adsnap",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
]

[project.scripts]
adrules = "adrules.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adrules"]
