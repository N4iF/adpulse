[project]
name = "adsnap"
version = "0.0.1"
description = "Active Directory snapshot collector and versioned schema (ADPulse engine)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Naif Al Anazi" }]
dependencies = [
  "pydantic>=2.8",
  "ldap3>=2.9.1",
  "winacl==0.1.9",
  "smbprotocol>=1.13",
  "typer>=0.12",
]

[project.scripts]
adsnap = "adsnap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsnap"]
